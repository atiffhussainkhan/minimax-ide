<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Santa — pose sheet</title>
<style>
  body { background:#1b2130; color:#e8ecf7; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; padding:28px; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  p.sub { color:#9aa3c0; margin:0 0 26px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
  .cell { background:#2a3350; border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:10px; text-align:center; }
  .cell svg { width:100%; height:170px; display:block; }
  .cell b { display:block; margin-top:6px; font-weight:600; }
  .cell span { color:#9aa3c0; font-size:12px; }
  .row { display:flex; align-items:flex-end; justify-content:center; gap:26px; margin:30px 0 10px; }
  .row .big { background:#3a4468; border-radius:16px; padding:14px; }
</style>
</head>
<body>
<h1>Santa — pose sheet</h1>
<p class="sub">Drawn entirely in code. Same shape list drives the SVG here and the canvas in the video exporter.</p>
<div class="grid" id="grid"></div>

<h1 style="margin-top:34px">Size check</h1>
<p class="sub">How he reads at the sizes that actually matter in a room photo.</p>
<div class="row" id="sizes"></div>

<script src="santa.js"></script>
<script>
  const grid = document.getElementById("grid");
  const names = Object.keys(Santa.poses);
  for (const n of names) {
    const shapes = Santa.build(n);
    const cell = document.createElement("div");
    cell.className = "cell";
    // Feet at y=0 -> sit the baseline near the bottom of the box.
    cell.innerHTML =
      Santa.toSVG(shapes, { x: 60, y: 158, scale: 1.35 }) +
      "<b>" + n + "</b><span>" + shapes.length + " shapes</span>";
    grid.appendChild(cell);
  }

  // Size ladder: a 640px-wide room photo means Santa is roughly 60-120px tall.
  const sizes = document.getElementById("sizes");
  for (const [label, h] of [["large", 150], ["normal", 96], ["small", 60], ["tiny", 38]]) {
    const box = document.createElement("div");
    box.className = "big";
    const s = h / 112;
    box.innerHTML = Santa.toSVG(Santa.build("stand"), { x: 40, y: h + 10, scale: s }) +
                    "<div style='text-align:center;color:#9aa3c0;font-size:12px'>" + label + " · " + h + "px</div>";
    sizes.appendChild(box);
  }
</script>
</body>
</html>
